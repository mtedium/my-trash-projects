$def with (game)
<!DOCTYPE html>
<html>

<head>
    <link rel="stylesheet" href="/static/css/style.css">
    <title>修改藏品 - 赛博玩家</title>
</head>

<body>
    <div class="container">
        <h1>📝 修改游戏信息</h1>

        <div class="card">
            <!-- 注意：action 里的 ID 是通过后端传进来的 -->
            <form method="POST" action="/edit/$game.id">
                <div style="margin-bottom: 15px;">
                    <label>游戏名称：</label><br>
                    <input type="text" name="title" value="$game.title" required
                        style="width: 100%; padding: 8px; background: #101921; color: white; border: 1px solid #66c0f4;">
                </div>

                <div style="margin-bottom: 15px;">
                    <label>所属平台：</label><br>
                    <select name="platform"
                        style="width: 100%; padding: 8px; background: #101921; color: white; border: 1px solid #66c0f4;">
                        <option value="Steam" ${'selected' if game.platform=='Steam' else '' }>Steam</option>
                        <option value="Switch" ${'selected' if game.platform=='Switch' else '' }>Switch</option>
                        <option value="PS5" ${'selected' if game.platform=='PS5' else '' }>PS5</option>
                        <option value="Epic" ${'selected' if game.platform=='Epic' else '' }>Epic</option>
                    </select>
                </div>

                <div style="margin-bottom: 15px;">
                    <label>游戏类型：</label><br>
                    <input type="text" name="genre" value="$game.genre"
                        style="width: 100%; padding: 8px; background: #101921; color: white; border: 1px solid #66c0f4;">
                </div>

                <div style="margin-bottom: 15px;">
                    <label>通关状态：</label><br>
                    <select name="status"
                        style="width: 100%; padding: 8px; background: #101921; color: white; border: 1px solid #66c0f4;">
                        <option value="吃灰中" ${'selected' if game.status=='吃灰中' else '' }>吃灰中</option>
                        <option value="进行中" ${'selected' if game.status=='进行中' else '' }>进行中</option>
                        <option value="已通关" ${'selected' if game.status=='已通关' else '' }>已通关</option>
                    </select>
                </div>

                <div style="margin-bottom: 20px;">
                    <label>我的评分 (1-10)：</label><br>
                    <input type="number" name="rating" value="$game.rating" min="1" max="10"
                        style="width: 100%; padding: 8px; background: #101921; color: white; border: 1px solid #66c0f4;">
                </div>

                <button type="submit" class="btn">更新数据库</button>
                <a href="/" style="color: #888; margin-left: 15px; text-decoration: none;">取消返回</a>
            </form>
        </div>
    </div>
</body>

</html>
