$def with ()
<!DOCTYPE html>
<html>

<head>
    <link rel="stylesheet" href="/static/css/style.css">
    <title>新增藏品 - 赛博玩家</title>
</head>

<body>
    <div class="container">
        <h1>➕ 录入新游戏</h1>

        <div class="card">
            <form method="POST" action="/add">
                <div style="margin-bottom: 15px;">
                    <label>游戏名称：</label><br>
                    <input type="text" name="title" required
                        style="width: 100%; padding: 8px; background: #101921; color: white; border: 1px solid #66c0f4;">
                </div>

                <div style="margin-bottom: 15px;">
                    <label>所属平台：</label><br>
                    <select name="platform"
                        style="width: 100%; padding: 8px; background: #101921; color: white; border: 1px solid #66c0f4;">
                        <option value="Steam">Steam</option>
                        <option value="Switch">Switch</option>
                        <option value="PS5">PS5</option>
                        <option value="Epic">Epic</option>
                        <option value="Other">其他</option>
                    </select>
                </div>

                <div style="margin-bottom: 15px;">
                    <label>游戏类型：</label><br>
                    <input type="text" name="genre" placeholder="如：RPG, ACT"
                        style="width: 100%; padding: 8px; background: #101921; color: white; border: 1px solid #66c0f4;">
                </div>

                <div style="margin-bottom: 15px;">
                    <label>通关状态：</label><br>
                    <select name="status"
                        style="width: 100%; padding: 8px; background: #101921; color: white; border: 1px solid #66c0f4;">
                        <option value="吃灰中">吃灰中</option>
                        <option value="进行中">进行中</option>
                        <option value="已通关">已通关</option>
                    </select>
                </div>

                <div style="margin-bottom: 20px;">
                    <label>我的评分 (1-10)：</label><br>
                    <input type="number" name="rating" min="1" max="10" value="5"
                        style="width: 100%; padding: 8px; background: #101921; color: white; border: 1px solid #66c0f4;">
                </div>

                <button type="submit" class="btn">同步到仓库</button>
                <a href="/" style="color: #888; margin-left: 15px; text-decoration: none;">取消返回</a>
            </form>
        </div>
    </div>
</body>

</html>
