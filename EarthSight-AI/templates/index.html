<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EarthSight AI - 实时地震聚类可视化</title>
    <link rel="stylesheet" href="/static/style.css">
    <!-- 引入 Globe.gl (CDN) -->
    <script src="//unpkg.com/three"></script>
    <script src="//unpkg.com/globe.gl"></script>
</head>
<body>
    
    <!-- 3D 地球容器 -->
    <div id="globeViz"></div>

    <!-- UI 层: 标题 -->
    <div class="ui-layer top-left">
        <h1>EarthSight AI</h1>
        <p>基于 USGS 数据与 DBSCAN 聚类的实时监控</p>
        <div id="status">正在连接卫星数据...</div>
    </div>

    <!-- UI 层: AI 分析弹窗 -->
    <div id="ai-modal" class="ui-layer modal hidden">
        <div class="modal-content">
            <h2 id="modal-title">分析中...</h2>
            <div id="modal-body" class="typing-effect"></div>
            <button onclick="closeModal()">关闭</button>
        </div>
    </div>

    <script src="/static/main.js"></script>
</body>
</html>
