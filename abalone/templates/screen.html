<html>
<head>
  <title>DataV</title>
  <script src="https://v2.vuejs.org/js/vue.min.js"></script>
  <!--调试版-->
  <script src="https://unpkg.com/@jiaminghi/data-view/dist/datav.map.vue.js"></script>
  <!--压缩版 生产版本-->
  <link rel="stylesheet" href="https://cdn.staticfile.org/twitter-bootstrap/3.3.7/css/bootstrap.min.css">  
  <script src="https://cdn.staticfile.org/jquery/2.1.1/jquery.min.js"></script>
  <script src="https://cdn.staticfile.org/twitter-bootstrap/3.3.7/js/bootstrap.min.js"></script>

<style>
    html, body, #app {
      width: 100%;
      height: 100%;
      margin: 0px;
      padding: 0px;
      background-color: rgb(7,29,73);
    }

    .border-box-content {
      color: rgb(66,185,131);
      font-size: 40px;
      font-weight: bold;
      display: flex;
      justify-content: center;
      align-items: center;
    }
  </style>
</head>
<body>
{% include 'nav.html' %}
  <div id="app" style="width:100%">
    <div class="row" style="height:10%;margin: 0px;">
      <div class="col-md-4">
        <dv-decoration-8/>
      </div>
      <div class="col-md-4 text-center">
        <h1 style="color:#ffffff;font-size:40px;justify-content: center;">
        鲍鱼年龄预测系统</h1>
         
      </div>
      <div class="col-md-4">
        <dv-decoration-8 :reverse="true" />
      </div>
    </div>

    <div class="row" style="height:80%;margin:0px">
      <div class="col-md-3">
        <dv-border-box-1 style="height:30%">
          <dv-charts :option="barOption"  />
        </dv-border-box-1>
        <dv-border-box-1 style="height:30%">
          <dv-charts :option="option1"  />
        </dv-border-box-1>

      </div>
      <div class="col-md-6">
        
        <div class="row text-center" style="height:20%">
          <div class="col-md-3">
            <dv-border-box-8 style="">线性回归模型:<br>98.70%</dv-border-box-8>
          </div>
          <div class="col-md-3">
            <dv-border-box-8 style="">随机森林模型:<br>99.70%</dv-border-box-8>
          </div>
          <div class="col-md-3">
            <dv-border-box-8 style="">XGBoost模型:<br>88.70%</dv-border-box-8>
          </div>
          <div class="col-md-3">
            <dv-border-box-8 style="">神经网络模型:<br>92.70%</dv-border-box-8>
          </div>
        </div>
        <div class="row" style="height:70%">
          <h1 style="color:#ffffff">预测日志</h1>
          <dv-border-box-3>
            <dv-scroll-board :config="tableConfig" style="width:85%;height:90%;font-size:30px" />
          </dv-border-box-3>
        </div>
      </div>
      <div class="col-md-3">
        <dv-border-box-4 >dv-border-box-4</dv-border-box-4>
      </div>

    </div>
    
    
  </div>

</body>
